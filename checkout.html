<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | MIMOS Collections</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap nav">
    <a href="index.html" class="logo">MIMOS<span>Collections</span></a>
    <div class="lead" style="font-size:13px;">🔒 Secure Checkout</div>
    <a href="cart.html" class="icon-btn" aria-label="Cart">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>
      <span class="cart-count">0</span>
    </a>
  </div>
</header>

<section id="checkout-section" style="padding-top:40px;">
  <div class="wrap" id="checkout-wrap"></div>
</section>

<div class="toast"></div>

<script src="js/art.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/render.js"></script>
<script>
const US_STATES = ['AL','AK','AZ','AR','CA','CO','CT','DE','FL','GA','HI','ID','IL','IN','IA','KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ','NM','NY','NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT','VA','WA','WV','WI','WY'];

function renderCheckout() {
  const lines = mimosCartLines();
  const wrap = document.getElementById('checkout-wrap');

  if (!lines.length) {
    wrap.innerHTML = `
      <div class="empty-state">
        <div class="big-icon">🛍️</div>
        <h2>Your bag is empty</h2>
        <p class="lead" style="max-width:380px;margin:0 auto 26px;">Add something you love before checking out.</p>
        <a href="shop.html" class="btn btn-primary">Start Shopping</a>
      </div>`;
    return;
  }

  const subtotal = mimosCartSubtotal();
  const shipping = subtotal >= 75 ? 0 : 8.95;
  const tax = subtotal * 0.07;
  const total = subtotal + shipping + tax;

  wrap.innerHTML = `
    <form class="checkout-layout" id="checkout-form">
      <div>
        <div class="form-card">
          <h3><span class="step-num">1</span> Contact &amp; Shipping Address</h3>
          <div class="form-grid">
            <div class="field full"><label>Email</label><input type="email" required placeholder="you@email.com"></div>
            <div class="field"><label>First Name</label><input type="text" required></div>
            <div class="field"><label>Last Name</label><input type="text" required></div>
            <div class="field full"><label>Address</label><input type="text" required placeholder="Street address"></div>
            <div class="field full"><label>Apt, Suite, etc. (optional)</label><input type="text"></div>
            <div class="field"><label>City</label><input type="text" required></div>
            <div class="field">
              <label>State</label>
              <select required><option value="">Select</option>${US_STATES.map(s=>`<option>${s}</option>`).join('')}</select>
            </div>
            <div class="field"><label>ZIP Code</label><input type="text" required pattern="[0-9]{5}"></div>
            <div class="field"><label>Phone</label><input type="tel" required placeholder="(555) 555-5555"></div>
          </div>
        </div>

        <div class="form-card">
          <h3><span class="step-num">2</span> Shipping Method</h3>
          <label class="ship-opt active"><span><input type="radio" name="ship" checked> Standard (5–7 business days)</span><span>${shipping === 0 ? 'FREE' : mimosFormatPrice(shipping)}</span></label>
          <label class="ship-opt"><span><input type="radio" name="ship"> Express (2–3 business days)</span><span>$18.95</span></label>
        </div>

        <div class="form-card">
          <h3><span class="step-num">3</span> Payment Details</h3>
          <div class="form-grid">
            <div class="field full"><label>Name on Card</label><input type="text" required></div>
            <div class="field full"><label>Card Number</label><input type="text" required placeholder="•••• •••• •••• ••••" maxlength="19"></div>
            <div class="field"><label>Expiration (MM/YY)</label><input type="text" required placeholder="MM/YY" maxlength="5"></div>
            <div class="field"><label>CVV</label><input type="text" required placeholder="•••" maxlength="4"></div>
          </div>
          <div class="card-icons">💳 &nbsp; 🅿️ &nbsp; 🍎Pay</div>
        </div>
      </div>

      <div>
        <div class="summary-box">
          <h3 class="mt-0">Order Summary</h3>
          ${lines.map(l => `
            <div class="mini-item">
              <div class="thumb">${mimosArt(l.product.seed, l.product.category)}<span class="qty-badge">${l.qty}</span></div>
              <div>
                <div class="name">${l.product.name}</div>
                <div class="opt">Size ${l.size}</div>
              </div>
              <div style="margin-left:auto;font-size:13px;font-weight:600;">${mimosFormatPrice(l.lineTotal)}</div>
            </div>`).join('')}
          <div class="summary-row" style="border-top:1px solid var(--line);padding-top:14px;"><span>Subtotal</span><span>${mimosFormatPrice(subtotal)}</span></div>
          <div class="summary-row"><span>Shipping</span><span>${shipping === 0 ? 'FREE' : mimosFormatPrice(shipping)}</span></div>
          <div class="summary-row"><span>Estimated Tax</span><span>${mimosFormatPrice(tax)}</span></div>
          <div class="summary-row total"><span>Total</span><span>${mimosFormatPrice(total)}</span></div>
          <button type="submit" class="btn btn-primary btn-block" style="margin-top:16px;">Place Order</button>
          <div class="secure-note">🔒 Payments are simulated on this demo site</div>
        </div>
      </div>
    </form>`;

  document.querySelectorAll('.ship-opt input').forEach(r => r.addEventListener('change', () => {
    document.querySelectorAll('.ship-opt').forEach(o => o.classList.remove('active'));
    r.closest('.ship-opt').classList.add('active');
  }));

  document.getElementById('checkout-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const orderNum = 'MC-' + Math.floor(100000 + Math.random() * 900000);
    localStorage.removeItem(MIMOS_CART_KEY);
    mimosUpdateCartBadge();
    wrap.innerHTML = `
      <div class="confirm-box">
        <div class="check-circle">✓</div>
        <h1>Thank you for your order!</h1>
        <p class="lead">A confirmation email is on its way. We'll notify you as soon as your MIMOS pieces ship.</p>
        <div class="order-num">Order #${orderNum}</div>
        <a href="shop.html" class="btn btn-primary">Continue Shopping</a>
      </div>`;
  });
}
renderCheckout();
</script>
</body>
</html>
